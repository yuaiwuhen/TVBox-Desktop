# Docker Compose配置
# 用于管理Spider服务容器
services:
  spider-server:
    # 构建配置
    build:
      context: .
      dockerfile: Dockerfile
    image: tvbox-spider-server:latest
    
    # 容器名称
    container_name: tvbox-spider
    
    # 特权模式（redroid需要）
    privileged: true
    
    # 端口映射
    ports:
      - "9978:9978"
    
    # 数据卷
    volumes:
      - spider-data:/data
    
    # 环境变量
    environment:
      - REDROID_PROP_ro.debuggable=1
      - ANDROIDBOOT_REDROID_GPU_MODE=guest
    
    # 重启策略
    restart: unless-stopped

# 数据卷定义
volumes:
  spider-data:
    driver: local