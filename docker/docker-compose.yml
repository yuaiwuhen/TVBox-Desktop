# Docker Compose配置
# 用于管理Spider服务容器
services:
  spider-server:
    # 构建配置
    build:
      context: .
      dockerfile: Dockerfile
    image: tvbox-spider-server:latest

    # 容器名称
    container_name: tvbox-spider

    # 特权模式（redroid需要）
    privileged: true

    # DNS 服务器（容器级，部分 Linux 网络栈仍会读取此配置）
    # Android 系统级 DNS 通过 SpiderApplication.configureDnsServers() 在
    # 应用启动时用 setprop net.dns1/dns2 设置（redroid 容器默认无 DNS 属性）。
    dns:
      - 8.8.8.8
      - 8.8.4.4

    # 端口映射
    # 使用 19978 避开 Windows 动态端口范围 (1024-15000)，
    # 该范围内的端口可能被 Clash Verge 等本地代理软件作为临时源端口占用，
    # 导致 Docker Desktop 端口转发无法绑定监听。
    ports:
      - "19978:9978"

    # 数据卷
    volumes:
      - spider-data:/data

    # 命令行参数：显式启用 libhoudini.so 作为 native bridge
    # codysk/redroid:12_houdini 镜像同时包含 libhoudini.so 和 libndk_translation.so
    # 默认 libnb.so -> libndk_translation.so，但 ndk_translation 在初始化时
    # 因缺少 __native_bridge_config_static_tls 符号崩溃，无法加载 ARM64 库
    # 切换到 libhoudini.so 修复此问题
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=1
      - ro.secure=0
      - ro.dalvik.vm.native.bridge=libhoudini.so

    # 重启策略
    restart: unless-stopped

# 数据卷定义
volumes:
  spider-data:
    driver: local
