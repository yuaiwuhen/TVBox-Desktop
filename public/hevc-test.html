<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>HEVC Test</title></head>
<body>
<h2>HEVC Decode Test</h2>
<div id="results"></div>
<script>
const r = document.getElementById('results');
function log(msg) { r.innerHTML += '<div>' + msg + '</div>'; console.log(msg); }

// Check HEVC codec support
const hevcCodecs = [
  'video/mp4; codecs="hev1.1.6.L120.90"',
  'video/mp4; codecs="hev1.1.6.L150.90"',
  'video/mp4; codecs="hvc1.1.6.L120.90"',
  'video/mp4; codecs="hev1.2.4.L120.90"',
  'video/mp4; codecs="hev1.1.6.L93.90"',
];
log('<b>HEVC Codec Support:</b>');
const v = document.createElement('video');
hevcCodecs.forEach(c => {
  const supported = v.canPlayType(c);
  log('  ' + c + ': ' + (supported || 'NOT SUPPORTED'));
});

log('<br><b>MediaSource.isTypeSupported:</b>');
const mseCodecs = [
  'video/mp4; codecs="hev1.1.6.L120.90"',
  'video/mp4; codecs="hvc1.1.6.L120.90"',
  'video/mp4; codecs="avc1.64001f"',
  'video/mp2t; codecs="hev1.1.6.L120.90"',
  'video/mp2t; codecs="avc1.64001f"',
];
mseCodecs.forEach(c => {
  log('  ' + c + ': ' + (MediaSource.isTypeSupported(c) ? 'YES' : 'NO'));
});

log('<br><b>Platform:</b> ' + navigator.platform);
log('<b>UserAgent:</b> ' + navigator.userAgent.substring(0, 100));
</script>
</body>
</html>
